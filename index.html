<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05030c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>Broken World</title>
<style>
  html, body { margin: 0; height: 100%; background: #05030c; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; image-rendering: auto; }
  /* hauteur réellement visible sur téléphone (sans la zone cachée sous les barres du navigateur) */
  @supports (height: 100dvh) { html, body { height: 100dvh; } canvas { max-height: 100dvh; max-width: 177.78dvh; } }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<div id="diag" style="position:fixed;left:6px;bottom:4px;z-index:20;color:#9aa0d0;font:11px sans-serif;pointer-events:none;white-space:pre-wrap;max-width:70vw"></div>
<script>
// Diagnostic visible sur téléphone (pas de console) : version, état du chargement, et toute erreur en texte
(() => {
  const d = document.getElementById('diag'), vOf = () => (document.querySelector('script[src*="game.js"]')?.src || '').match(/v=(\w+)/)?.[1] || '?';
  const errs = [];
  const show = () => { const st = typeof scene !== 'undefined' ? scene : '…'; d.textContent = `v${vOf()} · ${st} · ${document.getElementById("game").width}×${document.getElementById("game").height}` + (errs.length ? ' | ' + errs.slice(-3).join(' | '): ''); d.style.color = errs.length ? '#ff8080' : '#9aa0d0'; };
  addEventListener('error', e => { errs.push('Erreur : ' + (e.message || e.error) + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')'); show(); });
  addEventListener('unhandledrejection', e => { errs.push('Erreur : ' + (e.reason?.message || e.reason)); show(); });
  setInterval(show, 1000); show();
})();
</script>
<script src="src/config.js?v=1200"></script>
<script src="src/sprites.js?v=1200"></script>
<script src="src/sounds.js?v=1200"></script>
<script src="src/voices.js?v=1200"></script>
<script src="src/fx.js?v=1200"></script>
<script src="src/fxvideo.js?v=1200"></script>
<script src="src/midx.js?v=1200"></script>
<script src="src/level.js?v=1200"></script>
<script src="src/ambient.js?v=1200"></script>
<script src="src/ambient_life.js?v=1200"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="src/modes.js?v=1200"></script>
<script src="src/endless.js?v=1200"></script>
<script src="src/net.js?v=1200"></script>
<script src="src/netsync.js?v=1200"></script>
<script src="src/game.js?v=1200"></script>
<script src="src/touch.js?v=1200"></script>
</body>
</html>
